name: CICD Pipeline


on:
  push:
    branches: [main]

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Setup Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    # Install dependencies
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest

      # Run tests
    - name: Run tests
      run: pytest

    - name: Build Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/fastapi-app:${{ env.IMAGE_TAG }} .

    - name: Login to DockerHub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Image Push 
      run: docker push ${{ secrets.DOCKER_USERNAME }}/fastapi-app:${{ env.IMAGE_TAG }}


  deploy:
    runs-on: self-hosted
    needs: build-test

    env:
      IMAGE_TAG: ${{ github.sha }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      KUBECONFIG: C:\Users\nandh\.kube\config

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy 
        run: kubectl apply -f kubernetes/deployment.yml && kubectl apply -f kubernetes/service.yml
