name: CICD Pipeline


on:
  push:
    branches: [main]

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Setup Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    # Install dependencies
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest

      # Run tests
    - name: Run tests
      run: pytest

    - name: Prepare lowercase repo
      id: repo
      run: |
        USERNAME=$(echo "${{ secrets.DOCKER_USERNAME }}" | tr '[:upper:]' '[:lower:]')
        echo "repo=$USERNAME/equalexpert" >> $GITHUB_OUTPUT

    - name: Build Docker image
      run: docker build -t ${{ steps.repo.outputs.repo }}:${{ env.IMAGE_TAG }} .

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD}}

    - name: Push Docker image
      run: docker push ${{ steps.repo.outputs.repo }}:${{ env.IMAGE_TAG }}


  deploy:
    runs-on: self-hosted
    needs: build-test

    env:
      IMAGE_TAG: ${{ github.sha }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      KUBECONFIG: C:\Users\nandh\.kube\config

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare lowercase repo name
        id: repo
        run: |
          USERNAME=$(echo "${{ secrets.DOCKER_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=$USERNAME/equalexpert" >> $GITHUB_OUTPUT

      - name: Deploy 
        run: kubectl apply -f kubernetes/deployment.yaml && kubectl apply -f kubernetes/service.yaml
